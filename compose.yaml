services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cosmo_cats
      POSTGRES_USER: cosmo
      POSTGRES_PASSWORD: cosmo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmo -d cosmo_cats"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
