openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  version: 1.1.0
  description: |
    Laboratory API for Product CRUD backed by in-memory mock data.
    Data resets when the application restarts. PUT replaces all editable fields
    of an existing product and never creates a missing product.
    Pagination is zero-based, in insertion order, without database consistency guarantees.
    The external catalog lookup demonstrates a third-party RestClient integration.
    External products are not persisted and do not use local cosmic-name validation.
    Error responses follow RFC 9457 (https://www.rfc-editor.org/rfc/rfc9457).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Products
    description: Local marketplace Product CRUD
  - name: External catalog
    description: Read-only third-party catalog integration
paths:
  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Get a page of products
      description: |
        An empty catalog and a page beyond the available products return 200 with
        empty content and the current totalElements. This collection endpoint does not return 404.
        Without cursor, page/size select an offset page. With cursor, results start
        after that existing product in insertion order; page is ignored and the
        response page is 0. nextCursor is the last returned ID when more products
        exist, otherwise null. Unknown or deleted cursors return 400.
        Pagination uses an in-memory snapshot and has no database consistency guarantees.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index. Ignored when cursor is supplied; the response page is then 0.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: size
          in: query
          required: false
          description: Maximum number of products in the page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Existing local product UUID after which to continue. Takes precedence over page.
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      responses:
        '200':
          description: Requested product page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              examples:
                firstPage:
                  $ref: '#/components/examples/FirstProductPage'
                emptyCatalog:
                  $ref: '#/components/examples/EmptyCatalog'
                pageBeyondEnd:
                  $ref: '#/components/examples/PageBeyondEnd'
                cursorPage:
                  $ref: '#/components/examples/CursorPage'
        '400':
          description: Invalid pagination values, malformed UUID cursor or unknown/deleted cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidSize:
                  $ref: '#/components/examples/InvalidPageSize'
                unknownCursor:
                  $ref: '#/components/examples/UnknownCursor'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: Assigns a new UUID and stores the validated product in memory.
      requestBody:
        $ref: '#/components/requestBodies/ProductInput'
      responses:
        '201':
          description: Product created.
          headers:
            Location:
              description: Relative URI of the newly created product.
              schema:
                type: string
                format: uri-reference
                example: /api/v1/products/00000000-0000-0000-0000-000000000001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Missing/invalid product fields or unreadable JSON.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidPrice:
                  $ref: '#/components/examples/InvalidPrice'
                nonCosmicName:
                  $ref: '#/components/examples/NonCosmicName'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product by UUID
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Product ID is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidId:
                  $ref: '#/components/examples/InvalidProductId'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace an existing product
      description: All editable fields are required. The product ID remains unchanged.
      requestBody:
        $ref: '#/components/requestBodies/ProductInput'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product ID, missing/invalid fields or unreadable JSON.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidPrice:
                  $ref: '#/components/examples/InvalidUpdatePrice'
                invalidId:
                  $ref: '#/components/examples/InvalidProductId'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product by UUID
      responses:
        '204':
          description: Product deleted. The response has no body.
        '400':
          description: Product ID is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidId:
                  $ref: '#/components/examples/InvalidProductId'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/external/{externalId}:
    get:
      tags: [External catalog]
      operationId: getExternalCatalogProduct
      summary: Look up a product in the third-party DummyJSON catalog
      description: |
        Uses GET https://dummyjson.com/products/{externalId} through Spring RestClient.
        Returns selected provider fields without modifying the local marketplace.
        Provider errors other than 404, invalid responses and transport failures return 502.
        Transport failures and HTTP 500/502/503/504 are retried twice (three attempts
        in total), with delays of 200 and 400 ms. Other HTTP errors and invalid
        product responses are not retried. After retries are exhausted,
        CatalogUnavailableException is mapped to 502; CatalogProductNotFoundException maps to 404.
      parameters:
        - name: externalId
          in: path
          required: true
          description: Positive integer product ID in the external catalog.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            example: 1
      responses:
        '200':
          description: External product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProduct'
        '400':
          description: External ID is not a positive int32 integer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidExternalId:
                  $ref: '#/components/examples/InvalidExternalId'
        '404':
          $ref: '#/components/responses/ExternalProductNotFound'
        '502':
          $ref: '#/components/responses/ExternalCatalogFailure'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: UUID assigned by the marketplace when the product is created.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-0000-0000-000000000001
  requestBodies:
    ProductInput:
      required: true
      description: All five editable fields are required and must not be null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductRequest'
          example:
            name: Star Antigravity Yarn
            description: A floating yarn ball for intergalactic cats.
            price: 19.99
            category: TOYS
            sellerEmail: toys@cosmo-cats.market
  schemas:
    ProductRequest:
      type: object
      required: [name, description, price, category, sellerEmail]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\b([sS][tT][aA][rR]|[gG][aA][lL][aA][xX][yY]|[cC][oO][mM][eE][tT])\b'
          description: Nonblank. Must contain the whole word star, galaxy or comet, case-insensitively (@CosmicWordCheck).
          example: Star Antigravity Yarn
        description:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
          description: Nonblank product description.
          example: A floating yarn ball for intergalactic cats.
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999999.99
          multipleOf: 0.01
          description: Greater than zero; at most 10 integer digits and 2 decimal places. Stored as BigDecimal.
          example: 19.99
        category:
          $ref: '#/components/schemas/Category'
        sellerEmail:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Nonblank seller contact email, validated with Jakarta @Email.
          example: toys@cosmo-cats.market
    Category:
      type: string
      enum: [TOYS, FOOD, ACCESSORIES]
      description: Supported marketplace categories; enum values are case-sensitive.
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Server-assigned product UUID.
    ProductPage:
      type: object
      required: [content, page, size, totalElements, nextCursor]
      properties:
        content:
          type: array
          description: Products in this page, in insertion order; may be empty.
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Requested zero-based page index, or 0 in cursor mode.
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Requested page size, which may exceed the number of returned products.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Total number of local products in the snapshot used for this request.
        nextCursor:
          type: string
          format: uuid
          nullable: true
          description: Last returned product ID when more products remain; null at the end or for empty content.
          example: 00000000-0000-0000-0000-000000000001
    CatalogProduct:
      type: object
      required: [id, title, description, price]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: External provider ID, unrelated to local UUIDs.
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Original nonblank provider title; cosmic-name validation does not apply.
        description:
          type: string
          description: Original provider description.
        price:
          type: number
          minimum: 0
          description: Original provider price; no local price precision constraint applies.
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. status matches the HTTP response status; instance
        identifies the request path. Clients must ignore unrecognized extension members.
        Framework handling is reused with explicit API problem types and the HTTP reason as title.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI.
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          description: Human-readable summary of the problem type.
          example: Validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
          example: 400
        detail:
          type: string
          description: Explanation of this occurrence and how to correct it.
          example: "Field 'price' must be greater than 0."
        instance:
          type: string
          format: uri-reference
          description: Request path where the problem occurred.
          example: /api/v1/products
        errors:
          type: array
          description: RFC 9457 extension required for validation failures; lists each field or parameter and its violation.
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationProblem:
      description: Validation failure with a required errors extension identifying individual violations.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON field name, path/query parameter name or body for unreadable JSON.
          example: price
        message:
          type: string
          description: Validation rule violated by this field.
          example: must be greater than 0
  examples:
    FirstProductPage:
      summary: First page, with a cursor for the next product
      value:
        content:
          - id: 00000000-0000-0000-0000-000000000001
            name: Star Antigravity Yarn
            description: A floating yarn ball for intergalactic cats.
            price: 19.99
            category: TOYS
            sellerEmail: toys@cosmo-cats.market
        page: 0
        size: 1
        totalElements: 3
        nextCursor: 00000000-0000-0000-0000-000000000001
    EmptyCatalog:
      summary: No products exist; this is a successful response
      value:
        content: []
        page: 0
        size: 20
        totalElements: 0
        nextCursor: null
    PageBeyondEnd:
      summary: Offset page beyond the nonempty catalog
      value:
        content: []
        page: 999
        size: 20
        totalElements: 3
        nextCursor: null
    CursorPage:
      summary: One product after the first product's cursor
      value:
        content:
          - id: 00000000-0000-0000-0000-000000000002
            name: Galaxy Cosmic Milk
            description: Cosmic milk for long journeys through the galaxy.
            price: 8.50
            category: FOOD
            sellerEmail: food@cosmo-cats.market
        page: 0
        size: 1
        totalElements: 3
        nextCursor: 00000000-0000-0000-0000-000000000002
    InvalidPageSize:
      summary: Page size exceeds 100
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Field 'size' must be less than or equal to 100."
        instance: /api/v1/products
        errors:
          - field: size
            message: must be less than or equal to 100
    UnknownCursor:
      summary: The cursor UUID does not identify an existing product
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Field 'cursor' must refer to an existing product; cursor '00000000-0000-0000-0000-000000000099' is unknown."
        instance: /api/v1/products
        errors:
          - field: cursor
            message: "must refer to an existing product; cursor '00000000-0000-0000-0000-000000000099' is unknown"
    InvalidPrice:
      summary: Product price is zero
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Field 'price' must be greater than 0."
        instance: /api/v1/products
        errors:
          - field: price
            message: must be greater than 0
    InvalidUpdatePrice:
      summary: Updated product price is zero
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Field 'price' must be greater than 0."
        instance: /api/v1/products/00000000-0000-0000-0000-000000000001
        errors:
          - field: price
            message: must be greater than 0
    NonCosmicName:
      summary: Product name has no cosmic word
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Field 'name' must contain a cosmic word: star, galaxy or comet."
        instance: /api/v1/products
        errors:
          - field: name
            message: 'must contain a cosmic word: star, galaxy or comet'
    InvalidProductId:
      summary: Framework conversion error for a malformed product ID
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Failed to convert 'id' with value: 'not-a-uuid'"
        instance: /api/v1/products/not-a-uuid
        errors:
          - field: id
            message: "Failed to convert 'id' with value: 'not-a-uuid'"
    InvalidExternalId:
      summary: External product ID is zero
      value:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: "Field 'externalId' must be greater than or equal to 1."
        instance: /api/v1/products/external/0
        errors:
          - field: externalId
            message: must be greater than or equal to 1
  responses:
    ProductNotFound:
      description: No local product with this UUID. ProductNotFoundException is mapped to 404.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://cosmo-cats.market/errors/not-found
            title: Product not found
            status: 404
            detail: "Product '00000000-0000-0000-0000-000000000099' was not found."
            instance: /api/v1/products/00000000-0000-0000-0000-000000000099
    ExternalProductNotFound:
      description: Provider returned 404. CatalogProductNotFoundException is mapped to 404 without retries.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://cosmo-cats.market/errors/not-found
            title: Product not found
            status: 404
            detail: "External catalog product '999' was not found."
            instance: /api/v1/products/external/999
    ExternalCatalogFailure:
      description: Provider HTTP error other than 404, invalid provider response, connection failure or timeout.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://cosmo-cats.market/errors/external-catalog
            title: External catalog unavailable
            status: 502
            detail: External catalog is temporarily unavailable.
            instance: /api/v1/products/external/1
    UnsupportedMediaType:
      description: Request Content-Type is unsupported; send application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://cosmo-cats.market/errors/unsupported-media-type
            title: Unsupported Media Type
            status: 415
            detail: "Content-Type 'text/plain' is not supported."
            instance: /api/v1/products
    InternalError:
      description: Unexpected server error without implementation details in the response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://cosmo-cats.market/errors/internal
            title: Internal server error
            status: 500
            detail: An unexpected error occurred. Please try again later.
            instance: /api/v1/products
