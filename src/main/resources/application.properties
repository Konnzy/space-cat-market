spring.application.name=space-cat-market
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cosmo_cats}
spring.datasource.username=${DB_USERNAME:cosmo}
spring.datasource.password=${DB_PASSWORD:cosmo}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
catalog.base-url=https://dummyjson.com
catalog.connect-timeout=2s
catalog.read-timeout=3s
logging.level.com.market.spacecatmarket=DEBUG
